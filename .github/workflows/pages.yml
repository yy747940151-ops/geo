name: Deploy static article workbench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Render platform-friendly PNG illustrations
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq librsvg2-bin
          mkdir -p public/images
          cp index.html public/index.html
          for source in images/*.svg; do
            filename="$(basename "${source%.svg}")"
            rsvg-convert --width 1200 --height 675 "$source" --output "public/images/${filename}.png"
          done
      - name: Upload
        uses: actions/upload-pages-artifact@v3
        with:
          path: public
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
